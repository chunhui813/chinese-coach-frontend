<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習報告・語語教練</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --yellow:       #FFD60A;
      --yellow-light: #FFF9DB;
      --yellow-dark:  #C9A800;
      --purple:       #7B2FBE;
      --purple-light: #F0E5FF;
      --purple-dark:  #5A1F8C;
      --green:        #22C55E;
      --green-light:  #DCFCE7;
      --red:          #EF4444;
      --red-light:    #FEE2E2;
      --text:         #1A1A2E;
      --text-muted:   #777;
      --bg:           #FFFBF0;
      --white:        #FFFFFF;
      --radius:       18px;
      --shadow:       0 4px 20px rgba(123,47,190,.11);
    }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      padding-bottom: 32px;
    }

    /* ── Header ── */
    .page-header {
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: #fff;
      text-align: center;
      padding: 28px 20px 60px;
      position: relative;
    }

    .page-header h1 { font-size: 22px; font-weight: 900; margin-top: 8px; }
    .page-header p  { font-size: 13px; opacity: .8; margin-top: 4px; }

    /* ── Score card (overlaps header) ── */
    .score-section {
      max-width: 480px;
      margin: -44px auto 0;
      padding: 0 16px;
    }

    .score-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(123,47,190,.18);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    /* SVG score ring */
    .score-ring { flex-shrink: 0; position: relative; }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-score {
      font-size: 28px;
      font-weight: 900;
      color: var(--purple);
      line-height: 1;
    }

    .ring-unit {
      font-size: 11px;
      color: var(--text-muted);
    }

    .score-info { flex: 1; min-width: 0; }

    .score-grade {
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
    }

    .score-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .score-correct {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .correct-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 10px;
    }

    .correct-chip.yes { background: var(--green-light); color: #15803D; }
    .correct-chip.no  { background: var(--red-light);   color: #B91C1C; }

    /* ── Main content ── */
    .main {
      max-width: 480px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Section card ── */
    .section-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      padding: 13px 18px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .section-head.questions { background: var(--purple-light); color: var(--purple-dark); }
    .section-head.strengths { background: var(--green-light);  color: #166534; }
    .section-head.weaknesses { background: var(--red-light);   color: #991B1B; }
    .section-head.suggestions { background: var(--yellow-light); color: #854D0E; }
    .section-head.encourage   { background: linear-gradient(135deg, var(--purple-light), var(--yellow-light)); color: var(--purple-dark); }

    /* ── Question result items ── */
    .q-item {
      padding: 14px 18px;
      border-top: 1px solid #F5F0FF;
    }

    .q-item-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .q-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .q-num.correct { background: var(--green); color: #fff; }
    .q-num.wrong   { background: var(--red);   color: #fff; }

    .q-type {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: #F5F0FF;
      border-radius: 6px;
      padding: 2px 8px;
    }

    .q-result-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 10px;
    }

    .q-result-badge.correct { background: var(--green-light); color: #15803D; }
    .q-result-badge.wrong   { background: var(--red-light);   color: #B91C1C; }

    .q-question {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .q-answer {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
    }

    .q-answer strong { color: var(--text); font-weight: 600; }

    .q-feedback {
      margin-top: 8px;
      font-size: 12.5px;
      color: #444;
      background: #FAFAFA;
      border-left: 3px solid var(--purple);
      padding: 7px 10px;
      border-radius: 0 8px 8px 0;
      line-height: 1.55;
    }

    /* ── List items (strengths / weaknesses / suggestions) ── */
    .list-items { padding: 4px 0 8px; }

    .list-item {
      padding: 10px 18px;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.6;
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .list-item + .list-item { border-top: 1px solid rgba(0,0,0,.04); }

    .list-icon { flex-shrink: 0; font-size: 15px; }

    /* ── Encouragement ── */
    .encourage-body {
      padding: 18px 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--purple-dark);
      line-height: 1.7;
      text-align: center;
    }

    /* ── Back button ── */
    .btn-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff;
      border-radius: var(--radius);
      padding: 18px;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 6px 24px rgba(123,47,190,.32);
      transition: transform .18s, box-shadow .18s;
    }

    .btn-home:hover  { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(123,47,190,.4); }
    .btn-home:active { transform: translateY(0); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
    }

    .empty-state .emoji { font-size: 60px; display: block; margin-bottom: 16px; }
    .empty-state h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
    .empty-state p  { font-size: 14px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="page-header">
  <div style="font-size:40px">🎤</div>
  <h1>學習報告</h1>
  <p id="report-date">語語教練・練習結果</p>
</div>

<div class="score-section">
  <div class="score-card" id="score-card" style="display:none">
    <div class="score-ring">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="38"
          fill="none"
          stroke="var(--purple-light)"
          stroke-width="9"/>
        <circle id="ring-progress" cx="45" cy="45" r="38"
          fill="none"
          stroke="var(--purple)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-dasharray="238.76"
          stroke-dashoffset="238.76"
          transform="rotate(-90 45 45)"
          style="transition: stroke-dashoffset 1.2s ease"/>
      </svg>
      <div class="ring-label">
        <div class="ring-score" id="ring-score">0</div>
        <div class="ring-unit">分</div>
      </div>
    </div>

    <div class="score-info">
      <div class="score-grade" id="score-grade">–</div>
      <div class="score-desc"  id="score-desc">–</div>
      <div class="score-correct" id="score-correct"></div>
    </div>
  </div>
</div>

<div class="main" id="main" style="display:none">

  <!-- Questions -->
  <div class="section-card">
    <div class="section-head questions">📝 4 題結果</div>
    <div id="questions-list"></div>
  </div>

  <!-- Strengths -->
  <div class="section-card" id="strengths-card" style="display:none">
    <div class="section-head strengths">💪 強項</div>
    <div class="list-items" id="strengths-list"></div>
  </div>

  <!-- Weaknesses -->
  <div class="section-card" id="weaknesses-card" style="display:none">
    <div class="section-head weaknesses">⚠️ 需要加強</div>
    <div class="list-items" id="weaknesses-list"></div>
  </div>

  <!-- Suggestions -->
  <div class="section-card" id="suggestions-card" style="display:none">
    <div class="section-head suggestions">💡 語語教練的建議</div>
    <div class="list-items" id="suggestions-list"></div>
  </div>

  <!-- Encouragement -->
  <div class="section-card" id="encourage-card" style="display:none">
    <div class="section-head encourage">🌟 語語教練說</div>
    <div class="encourage-body" id="encourage-body"></div>
  </div>

  <a href="index.html" class="btn-home">🏠 回首頁</a>
</div>

<!-- Empty state (shown when no report) -->
<div class="empty-state" id="empty-state" style="display:none">
  <span class="emoji">📭</span>
  <h2>沒有找到練習報告</h2>
  <p>請先完成一次練習！</p>
  <br>
  <a href="index.html" class="btn-home" style="margin:0 auto;max-width:280px">🏠 回首頁</a>
</div>

<script src="storage.js"></script>
<script>
  function gradeLabel(score) {
    if (score >= 100) return ['滿分！超級棒 🏆', '哇！你把 Soyeon 都震驚了！'];
    if (score >= 75)  return ['優秀 ★★★',   '表現很好，繼續加油！'];
    if (score >= 50)  return ['加油 ★★',     '有進步空間，明天再戰！'];
    return                   ['繼續努力 ★',   '沒關係，失敗是成功之母！'];
  }

  function renderReport(r) {
    // Date
    if (r.timestamp) {
      const d = new Date(r.timestamp);
      document.getElementById('report-date').textContent =
        `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 練習結果`;
    }

    // Score ring animation
    const score = Math.max(0, Math.min(100, r.score ?? 0));
    const circumference = 238.76;
    const offset = circumference - (circumference * score / 100);

    setTimeout(() => {
      document.getElementById('ring-progress').style.strokeDashoffset = offset;
    }, 150);

    // Animate score number
    let current = 0;
    const step = Math.ceil(score / 40);
    const counter = setInterval(() => {
      current = Math.min(current + step, score);
      document.getElementById('ring-score').textContent = current;
      if (current >= score) clearInterval(counter);
    }, 30);

    const [grade, desc] = gradeLabel(score);
    document.getElementById('score-grade').textContent = grade;
    document.getElementById('score-desc').textContent  = desc;

    // Correct chips
    const correctEl = document.getElementById('score-correct');
    const qs = r.questions ?? [];
    const correctCount = qs.filter(q => q.isCorrect).length;
    correctEl.innerHTML = `
      <span class="correct-chip yes">✓ 答對 ${correctCount} 題</span>
      <span class="correct-chip no">✗ 答錯 ${qs.length - correctCount} 題</span>
    `;

    // Questions
    const qList = document.getElementById('questions-list');
    qs.forEach((q, i) => {
      const cls = q.isCorrect ? 'correct' : 'wrong';
      const icon = q.isCorrect ? '✓' : '✗';
      const label = q.isCorrect ? '答對' : '答錯';

      qList.innerHTML += `
        <div class="q-item">
          <div class="q-item-head">
            <div class="q-num ${cls}">${icon}</div>
            <span class="q-type">${escHtml(q.type || `第${i+1}題`)}</span>
            <span class="q-result-badge ${cls}">${label}</span>
          </div>
          <div class="q-question">${escHtml(q.question || '–')}</div>
          <div class="q-answer">學生回答：<strong>${escHtml(q.studentAnswer || '–')}</strong></div>
          ${q.feedback ? `<div class="q-feedback">${escHtml(q.feedback)}</div>` : ''}
        </div>
      `;
    });

    // Strengths
    if (r.strengths?.length) {
      document.getElementById('strengths-card').style.display = '';
      r.strengths.forEach(s => {
        document.getElementById('strengths-list').innerHTML +=
          `<div class="list-item"><span class="list-icon">✅</span><span>${escHtml(s)}</span></div>`;
      });
    }

    // Weaknesses
    if (r.weaknesses?.length) {
      document.getElementById('weaknesses-card').style.display = '';
      r.weaknesses.forEach(s => {
        document.getElementById('weaknesses-list').innerHTML +=
          `<div class="list-item"><span class="list-icon">⚡</span><span>${escHtml(s)}</span></div>`;
      });
    }

    // Suggestions
    if (r.suggestions?.length) {
      document.getElementById('suggestions-card').style.display = '';
      r.suggestions.forEach((s, i) => {
        document.getElementById('suggestions-list').innerHTML +=
          `<div class="list-item"><span class="list-icon">${i + 1}.</span><span>${escHtml(s)}</span></div>`;
      });
    }

    // Encouragement
    if (r.encouragement) {
      document.getElementById('encourage-card').style.display = '';
      document.getElementById('encourage-body').textContent = r.encouragement;
    }

    // Show everything
    document.getElementById('score-card').style.display = 'flex';
    document.getElementById('main').style.display = 'flex';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  /* ── Boot ── */
  (function () {
    const report = Storage.getLastReport();
    if (!report) {
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    renderReport(report);
  })();
</script>
</body>
</html>
